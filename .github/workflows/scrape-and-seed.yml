name: Scrape DSE & Seed Cloudflare KV

on:
  schedule:
    # 03:30 PM BST (Bangladesh Standard Time, UTC+6) -> 09:30 AM UTC
    # Runs Sunday through Thursday (trading days: 0=Sun, 1=Mon, 2=Tue, 3=Wed, 4=Thu)
    - cron: "30 9 * * 0-4"

  # Manual trigger with optional concurrency input
  workflow_dispatch:
    inputs:
      concurrency:
        description: "Scrape concurrency (parallel requests)"
        required: false
        default: "8"

concurrency:
  group: scrape-and-seed-kv
  cancel-in-progress: true

jobs:
  scrape-and-upload:
    name: Scrape DSE Data and Upload to KV
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Scrape DSE stock data
        run: |
          CONCURRENCY="${{ github.event.inputs.concurrency || '8' }}"
          npx tsx scripts/index.ts --scrape --concurrency $CONCURRENCY --delay 250

      - name: Upload datasets to Cloudflare KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run kv:seed:prod

      - name: Revalidate Production Cache
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          echo "Triggering on-demand cache revalidation for production..."
          if [ -n "$REVALIDATE_SECRET" ]; then
            curl -fsS -X POST "https://dse-filter.1mt2.workers.dev/api/revalidate?secret=${REVALIDATE_SECRET}" \
              -H "Content-Type: application/json" \
              -d '{"tag": "stocks"}' || echo "⚠️ Revalidation request failed or worker unreachable"
          else
            curl -fsS -X POST "https://dse-filter.1mt2.workers.dev/api/revalidate" \
              -H "Content-Type: application/json" \
              -d '{"tag": "stocks"}' || echo "⚠️ Revalidation request failed or worker unreachable"
          fi
